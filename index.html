<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização de Alunos em Cards</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        
        .container-cards {
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
        }
     
        .card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px); 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .card h2 {
            margin-top: 0;
            color: #007bff;
        }
        .card p {
            margin: 8px 0;
            color: #555;
            font-size: 16px;
        }
        .card p strong {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Alunos Cadastrados</h1>

    <div class="container-cards">

        <div class="card">
            <h2>Taylanne</h2>
            <p><strong>Turma:</strong> 4N</p>
            <p><strong>Disciplina:</strong> Desenvolvimento de </p>
        </div>

        <div class="card">
            <h2>Eduardo</h2>
            <p><strong>Turma:</strong> 4N</p>
            <p><strong>Disciplina:</strong> História da Arte</p>
        </div>

        <div class="card">
            <h2>Gabriel</h2>
            <p><strong>Turma:</strong> 4N</p>
            <p><strong>Disciplina:</strong> Programação Web</p>
        </div>
        
        <div class="card">
            <h2>Nicolas</h2>
            <p><strong>Turma:</strong> 4N</p>
            <p><strong>Disciplina:</strong> Programação Web</p>
        </div>

        </div>

</body>
</html>
